name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  policy-checks:
    name: Policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cross-platform policy, contrast, and Cargo DAG checks
        run: python3 ./build/check_policy.py

      - name: Banned vocabulary in user-facing copy (PowerShell)
        shell: pwsh
        run: ./build/Test-BannedVocabulary.ps1

      - name: Accessibility contrast (PowerShell)
        shell: pwsh
        run: ./build/Test-Contrast.ps1

  build-and-test:
    name: Build, clippy, and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

  package-msix:
    name: Package MSIX (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rust_target: x86_64-pc-windows-msvc
          - platform: arm64
            rust_target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary (${{ matrix.rust_target }})
        run: cargo build --release -p ef-app --target ${{ matrix.rust_target }}

      - name: Pack MSIX
        shell: pwsh
        run: >
          ./build/Pack-Msix.ps1
          -Platform ${{ matrix.platform }}
          -BinaryPath target/${{ matrix.rust_target }}/release/vun.exe

      - name: Assert runFullTrust is declared in staged manifest
        shell: pwsh
        run: |
          $manifest = "target/msix-stage/${{ matrix.platform }}/AppxManifest.xml"
          if (-not (Test-Path $manifest)) { throw "Staged AppxManifest.xml missing." }
          [xml] $xml = Get-Content $manifest -Raw
          $caps = $xml.GetElementsByTagName('rescap:Capability') | ForEach-Object { $_.Name }
          if ($caps -notcontains 'runFullTrust') { throw "runFullTrust is missing from AppxManifest.xml." }
          Write-Host "Verified runFullTrust for ${{ matrix.platform }}"

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.platform }}
          path: artifacts/msix/Vun_${{ matrix.platform }}.msix
          if-no-files-found: error

  package-unpackaged:
    name: Publish standalone binary (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build standalone release binary
        run: cargo build --release -p ef-app --target x86_64-pc-windows-msvc

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: unpackaged-win-x64
          path: target/x86_64-pc-windows-msvc/release/vun.exe
          if-no-files-found: error
